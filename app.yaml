command: ['npm', 'run', 'start']
env:
  - name: DATABRICKS_VOLUME_FILES
    valueFrom: files
  # One deployment serves exactly one Study (FR-017). STUDY_ID names this Study's subdirectory
  # under the shared root <volume>/text_cluster_validation/. It MUST match study.json's studyId.
  # Run a second concurrent study by deploying another app with a different STUDY_ID and URL.
  - name: STUDY_ID
    value: study-006
  # App-wide UI language for built-in strings (buttons, prompts, system messages, the default
  # welcome copy). One of `nl` or `en`; defaults to `en` when unset or invalid. Not per-study and
  # not participant-selectable. Never translates researcher-authored content or task items.
  - name: SURVEY_LANGUAGE
    value: nl
